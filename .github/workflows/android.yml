name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Create Android project, icons and splash
        run: npm run android
      - name: Use Mikomi's fixed signing key
        env:
          KEY: ${{ secrets.MIKOMI_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > android/app/mikomi-debug.p12
            python3 tools/android-signing.py
          else
            echo "::warning::No MIKOMI_DEBUG_KEYSTORE secret set. Building with Gradle's own debug key, so Google sign-in will not work in this APK."
          fi

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mikomi-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mikomi-test-apk
          path: mikomi-test.apk
      - name: Publish as the "Latest test build" release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: Test build of the Mikomi app from the main branch. Download mikomi-test.apk on an Android phone and open it to install.
          files: mikomi-test.apk
          prerelease: true
