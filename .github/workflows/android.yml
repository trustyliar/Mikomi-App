name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Create Android project, icons and splash
        run: npm run android
      - name: Configure signing and Firebase
        env:
          KEY: ${{ secrets.MIKOMI_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > android/app/mikomi-debug.p12
          else
            echo "::warning::No MIKOMI_DEBUG_KEYSTORE secret set, so this APK is signed with a throwaway key and Google sign-in will not work."
          fi
          cp -f android-config/google-services.json android/app/google-services.json 2>/dev/null || true
          python3 tools/android-config.py

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mikomi-test.apk
      - name: Build a diagnostic APK without the sign-in plugin
        run: |
          python3 - <<'EOF'
          import json
          pkg = json.load(open('package.json'))
          for d in ['@capacitor-firebase/authentication']:
              pkg['dependencies'].pop(d, None)
          json.dump(pkg, open('package.json', 'w'), indent=2)
          cfg = json.load(open('capacitor.config.json'))
          cfg['appId'] = 'in.mikomi.nofb'
          cfg['appName'] = 'Mikomi NoSignin'
          cfg.pop('plugins', None)
          json.dump(cfg, open('capacitor.config.json', 'w'), indent=2)
          EOF
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mikomi-nosignin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mikomi-test-apk
          path: |
            mikomi-test.apk
            mikomi-nosignin.apk
      - name: Publish as the "Latest test build" release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Test builds of the Mikomi app from the main branch.
            mikomi-test.apk is the real app. mikomi-nosignin.apk is a diagnostic build with every plugin removed; it installs alongside the real one under the name "Mikomi Plain".
          files: |
            mikomi-test.apk
            mikomi-nosignin.apk
          prerelease: true
